<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gem &amp; Jewellery Management System</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root{
            --navy:#0d1220; --navy-2:#141b2e; --card:#161d30; --border:#2a3352;
            --gold:#d4af37; --gold-soft:#e8c96a; --text:#eef1f8; --muted:#8b93ab;
            --accent-blue:#7c9cff; --danger:#e5677a; --ok:#6fd38f;
        }
        *{box-sizing:border-box;}

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;

            background-image: url('images/Gemini_Generated_Image_5ldbwd5ldbwd5ldb.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: var(--text);
            min-height: 100vh;
        }
        h2{margin-top:0;color:var(--gold-soft);font-size:18px;font-weight:600;}
        label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;}
        input, select{
            width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--border);
            background:var(--navy-2); color:var(--text); font-size:14px;
        }
        input:focus, select:focus{outline:none;border-color:var(--gold);}
        .row{display:flex;gap:14px;flex-wrap:wrap;}
        .row > div{flex:1;min-width:180px;}
        button.btn{
            background:linear-gradient(180deg, var(--gold-soft), var(--gold));
            color:#241a04; border:none; padding:11px 18px; border-radius:7px;
            cursor:pointer; margin-top:14px; font-size:14px; font-weight:600;
        }
        button.btn:hover{filter:brightness(1.08);}
        .hint{font-size:12px;color:var(--muted);margin-top:10px;}
        .msg{margin-top:10px;font-size:13px;}
        .msg.ok{color:var(--ok);}
        .msg.err{color:var(--danger);}

        .auth-shell{
            min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 16px;
        }
        .auth-wrap{display:flex;justify-content:center;flex-direction:column;width:100%;max-width:560px;margin:0 auto;}
        .auth-card{
            width:100%; max-width:420px;
            background:linear-gradient(180deg, rgba(22,29,48,.96), rgba(17,23,39,.98)),
            url('images/dashboard-accent.jpg') center/cover no-repeat;
            border:1px solid var(--border); border-radius:14px; padding:34px 32px; text-align:center;
        }
        .auth-icon{color:var(--gold);font-size:22px;margin-bottom:6px;}
        .auth-title{margin:0;font-size:21px;font-weight:700;color:#fff;letter-spacing:.4px;}
        .auth-subtitle{margin:6px 0 20px;font-size:13px;color:var(--accent-blue);}
        .auth-toggle{display:flex;gap:4px;background:var(--navy-2);border-radius:8px;padding:4px;margin-bottom:18px;}
        .auth-toggle-btn{
            flex:1;background:transparent;border:none;color:var(--muted);padding:8px;border-radius:6px;
            cursor:pointer;font-size:13px;font-weight:600;
        }
        .auth-toggle-btn.active{background:var(--gold);color:#241a04;}
        .authtab{display:none;text-align:left;}
        .authtab.active{display:block;}
        .auth-card label{text-align:left;}
        .auth-card button.btn{width:100%;padding:12px;font-size:14px;}
        .auth-card .hint{text-align:center;}
        .auth-link{color:var(--accent-blue);cursor:pointer;text-decoration:underline;}
    </style>
</head>
<body>

<div id="authShell" class="auth-shell">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-icon">&#10022;</div>
            <h2 class="auth-title">GEM &amp; JEWELLERY</h2>
            <p class="auth-subtitle">Management System &mdash; sign in to continue</p>

            <div class="auth-toggle">
                <button type="button" class="auth-toggle-btn active" data-authtab="authtab-login">Login</button>
                <button type="button" class="auth-toggle-btn" data-authtab="authtab-register">Register</button>
            </div>

            <div id="authtab-login" class="authtab active">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="admin">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="admin123">
                <button class="btn" onclick="login()">Sign In</button>
                <p class="hint">Default seeded account &rarr; <b>admin / admin123</b> (role: ADMIN)</p>
                <div id="loginMsg" class="msg"></div>
            </div>

            <div id="authtab-register" class="authtab">
                <label>Username</label>
                <input type="text" id="regUsername">
                <label>Password</label>
                <input type="password" id="regPassword">
                <label>Full Name</label>
                <input type="text" id="regFullName">
                <div class="row">
                    <div><label>Email</label><input type="text" id="regEmail"></div>
                    <div><label>Phone</label><input type="text" id="regPhone"></div>
                </div>
                <label>Address</label>
                <input type="text" id="regAddress">
                <button class="btn" onclick="registerCustomer()">Create Account</button>
                <div id="regMsg" class="msg"></div>
                <p class="hint">New customer? Fill this in and switch back to
                    <span class="auth-link" onclick="$('.auth-toggle-btn[data-authtab=authtab-login]').click()">Login</span>
                    once created.
                </p>
            </div>
        </div>
    </div>

    <div id="staffRegisterBox" class="auth-wrap" style="margin-top:22px;">
        <div class="auth-card" style="max-width:520px;text-align:left;">
            <h2 style="text-align:left;">
                Register Staff / Admin
                <span style="color:var(--muted);font-weight:400;font-size:12px;">(Admin only)</span>
            </h2>
            <div class="row">
                <div><label>Username</label><input type="text" id="staffUsername"></div>
                <div><label>Password</label><input type="password" id="staffPassword"></div>
                <div>
                    <label>Role</label>
                    <select id="staffRole"><option value="STAFF">STAFF</option><option value="ADMIN">ADMIN</option></select>
                </div>
            </div>
            <button class="btn" style="width:auto;" onclick="registerStaff()">Create Staff/Admin</button>
            <div id="staffMsg" class="msg"></div>
        </div>
    </div>
</div>

<script>
</script>
</body>
</html>
